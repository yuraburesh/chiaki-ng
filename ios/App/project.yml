# AnyPlay для iPhone та iPad. Проєкт Xcode створює XcodeGen (у CI); власник відкриває AnyPlay.xcodeproj,
# обирає свій Apple ID (Signing & Capabilities → Team) і натискає Run.
name: AnyPlay
options:
  bundleIdPrefix: com.yuraburesh
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    OTHER_LDFLAGS: ["-lc++", "-lz", "-lresolv"]
targets:
  AnyPlay:
    type: application
    platform: iOS
    sources:
      - path: AnyPlay
      - path: Resources/web
        type: folder
        buildPhase: resources
      - path: Resources/cacert.pem
        buildPhase: resources
    dependencies:
      - framework: Frameworks/AnyPlayCore.xcframework
        embed: false
      - sdk: VideoToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: WebKit.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: CoreServices.framework
    info:
      path: AnyPlay/Info.plist
      properties:
        CFBundleDisplayName: AnyPlay
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        AnyPlayBuild: "$(ANYPLAY_BUILD)"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: DirectionalGamepad
        LSApplicationQueriesSchemes: [tg]
        NSLocalNetworkUsageDescription: "AnyPlay з'єднується з приставкою PS5 для гри."
        NSMicrophoneUsageDescription: "Щоб друзі чули тебе, коли ви дивитесь гру разом."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # власник обрав у Xcode свій Apple ID (Personal Team) і цей ідентифікатор — наступні версії проєкту їх зберігають
        PRODUCT_BUNDLE_IDENTIFIER: com.any.play
        DEVELOPMENT_TEAM: 59DYYJ566R
        PRODUCT_NAME: AnyPlay
        ANYPLAY_BUILD: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
