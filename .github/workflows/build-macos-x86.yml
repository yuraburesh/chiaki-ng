name: Build chiaki-ng macOSX Intel x86_64

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-mac_x86_64:
    name: Build macOSX Intel version
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install protobuf
        run: |
          pip3 install --user 'protobuf>=5,<6' --break-system-packages

      # Homebrew no longer ships Intel bottles (Tier 3), so Qt comes from the official
      # universal build and the C libraries from MacPorts' prebuilt x86_64 archives.
      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          host: 'mac'
          target: 'desktop'
          modules: 'qtwebengine qtpositioning qtwebchannel qtwebsockets qtserialport'

      - name: Install MacPorts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/macports/macports-base/releases/latest --jq '.assets[] | select(.name|test("-15-Sequoia.pkg$")) | .browser_download_url')
          echo "MacPorts: $url"
          curl -fsSL -o macports.pkg "$url"
          sudo installer -pkg macports.pkg -target /
          echo "/opt/local/bin" >> $GITHUB_PATH
          echo "/opt/local/sbin" >> $GITHUB_PATH

      - name: Install MacPorts dependencies
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          sudo port -q selfupdate
          FF=""
          for c in ffmpeg8 ffmpeg7 ffmpeg6; do
            if port -q info "$c" >/dev/null 2>&1; then FF=$c; break; fi
          done
          echo "FFmpeg port: $FF"
          sudo port -N install pkgconfig nasm ninja openssl3 libopus libplacebo protobuf3-cpp vulkan-headers "$FF"
          for opt in speexdsp json-c miniupnpc libevent vulkan-loader; do sudo port -N install "$opt" || echo "optional port $opt skipped"; done
          PCDIR=$(dirname "$(find /opt/local -name libavcodec.pc | head -1)")
          echo "FFmpeg pkgconfig: $PCDIR"
          echo "PKG_CONFIG_PATH=$PCDIR:/opt/local/lib/pkgconfig:/usr/local/lib/pkgconfig" >> $GITHUB_ENV
          echo "FFMPEG_INC=$(dirname "$PCDIR")/../include" >> $GITHUB_ENV
          echo "FFMPEG_LIBDIR=$(dirname "$PCDIR")" >> $GITHUB_ENV

      - name: Install sdl2-compat
        run: |
          sudo INSTALL_PREFIX=/usr/local scripts/build-sdl2-compat.sh
          sudo cp /usr/local/lib/pkgconfig/sdl2-compat.pc /usr/local/lib/pkgconfig/sdl2.pc

      - name: Configure chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF \
            -DOPENSSL_ROOT_DIR=/opt/local/libexec/openssl3 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;/opt/local/libexec/openssl3;/opt/local" \
            -DCMAKE_FIND_FRAMEWORK=LAST

      - name: Build chiaki-ng
        run: |
          export CPATH=$FFMPEG_INC:/opt/local/include
          cmake --build build --config Release --clean-first --target chiaki

      - name: Deploy chiaki-ng
        run: |
          rm -rf AnyPlay.app chiaki-ng.dmg
          cp -a build/gui/chiaki.app AnyPlay.app
          cp scripts/qtwebengine_import.qml gui/src/qml/
          "$QT_ROOT_DIR/bin/macdeployqt" AnyPlay.app -qmldir="$PWD/gui/src/qml" -libpath=/opt/local/lib -libpath="$FFMPEG_LIBDIR"
          mkdir -p AnyPlay.app/Contents/Resources/vulkan/icd.d
          curl -fsSL -O https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-macos.tar && tar xf MoltenVK-macos.tar
          cp MoltenVK/MoltenVK/dynamic/dylib/macOS/* AnyPlay.app/Contents/Resources/vulkan/icd.d
          "$QT_ROOT_DIR/bin/macdeployqt" AnyPlay.app -qmldir="$PWD/gui/src/qml" -libpath=/opt/local/lib -libpath="$FFMPEG_LIBDIR"
          if [[ -d AnyPlay.app/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app ]]
          then
            ln -s ../../../../../../../Frameworks AnyPlay.app/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app/Contents
          fi
          cp /usr/local/lib/libSDL3.dylib AnyPlay.app/Contents/MacOS/libSDL3.dylib
          cp /usr/local/lib/libSDL2-2.0.0.dylib AnyPlay.app/Contents/MacOS/libSDL2-2.0.0.dylib
          install_name_tool -id @executable_path/libSDL3.dylib AnyPlay.app/Contents/MacOS/libSDL3.dylib
          install_name_tool -id @executable_path/libSDL2-2.0.0.dylib AnyPlay.app/Contents/MacOS/libSDL2-2.0.0.dylib
          install_name_tool -change /usr/local/lib/libSDL3.dylib @executable_path/libSDL3.dylib AnyPlay.app/Contents/MacOS/libSDL2-2.0.0.dylib || true
          install_name_tool -change @rpath/libSDL3.dylib @executable_path/libSDL3.dylib AnyPlay.app/Contents/MacOS/libSDL2-2.0.0.dylib || true
          install_name_tool -change /opt/homebrew/lib/libSDL3.dylib @executable_path/libSDL3.dylib AnyPlay.app/Contents/MacOS/libSDL2-2.0.0.dylib || true
          install_name_tool -change /usr/local/lib/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib AnyPlay.app/Contents/MacOS/chiaki || true
          install_name_tool -change @rpath/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib AnyPlay.app/Contents/MacOS/chiaki || true
          install_name_tool -change /opt/homebrew/lib/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib AnyPlay.app/Contents/MacOS/chiaki || true
          # AnyPlay: без завантажувача Vulkan програма падає на повільний OpenGL (ривки в грі)
          if [[ ! -e AnyPlay.app/Contents/Frameworks/libvulkan.1.dylib ]]; then
            cp -L /opt/local/lib/libvulkan.1.dylib AnyPlay.app/Contents/Frameworks/libvulkan.1.dylib
            chmod u+w AnyPlay.app/Contents/Frameworks/libvulkan.1.dylib
            install_name_tool -id @loader_path/libvulkan.1.dylib AnyPlay.app/Contents/Frameworks/libvulkan.1.dylib
          fi
          ln -s libvulkan.1.dylib AnyPlay.app/Contents/Frameworks/vulkan
          # AnyPlay: усі бібліотеки — лише всередині програми (у клієнтів немає MacPorts/Homebrew)
          rm -f AnyPlay.app/Contents/PlugIns/sqldrivers/libqsqlmimer.dylib AnyPlay.app/Contents/PlugIns/sqldrivers/libqsqlodbc.dylib AnyPlay.app/Contents/PlugIns/sqldrivers/libqsqlpsql.dylib
          for pass in 1 2 3 4; do
            changed=0
            while IFS= read -r f; do
              for dep in $(otool -L "$f" 2>/dev/null | tail -n +2 | awk '{print $1}' | grep -E '^/(opt/local|usr/local|opt/homebrew)/' || true); do
                if [[ "$dep" == *.framework/* ]]; then
                  # фреймворк Qt уже лежить у програмі — лише виправляємо посилання (без копії)
                  fw=$(echo "$dep" | sed -E 's|^.*/([^/]+\.framework/.*)$|\1|')
                  if [[ -e "AnyPlay.app/Contents/Frameworks/$fw" ]]; then
                    if [[ "$f" == *QtWebEngineProcess* ]]; then new="@rpath/$fw"; else new="@executable_path/../Frameworks/$fw"; fi
                    echo "fix-fw: $f -> $new"
                    install_name_tool -change "$dep" "$new" "$f"
                    changed=1
                    continue
                  fi
                fi
                base=$(basename "$dep")
                if [[ ! -e "AnyPlay.app/Contents/Frameworks/$base" ]]; then
                  cp -L "$dep" "AnyPlay.app/Contents/Frameworks/$base"
                  chmod u+w "AnyPlay.app/Contents/Frameworks/$base"
                  install_name_tool -id "@loader_path/$base" "AnyPlay.app/Contents/Frameworks/$base"
                fi
                # короткий шлях (@loader_path) вміщується в заголовок бібліотеки, довгий — ні
                if [[ "$(dirname "$f")" == "AnyPlay.app/Contents/Frameworks" ]]; then new="@loader_path/$base"; else new="@executable_path/../Frameworks/$base"; fi
                echo "fix: $f -> $new"
                install_name_tool -change "$dep" "$new" "$f"
                changed=1
              done
            done < <(find AnyPlay.app/Contents/Frameworks AnyPlay.app/Contents/MacOS AnyPlay.app/Contents/PlugIns -type f \( -name '*.dylib' -o -perm -u+x \))
            [[ $changed = 0 ]] && break
          done
          bad=$(find AnyPlay.app/Contents -type f \( -name '*.dylib' -o -perm -u+x \) -exec otool -L {} \; 2>/dev/null | grep -E '^[[:space:]]+/(opt/local|usr/local|opt/homebrew)/' || true)
          if [[ -n "$bad" ]]; then echo "Залишились зовнішні бібліотеки:"; echo "$bad"; exit 1; fi
          # AnyPlay: лишаємо в бібліотеках тільки одну архітектуру — файл удвічі менший
          find AnyPlay.app -type f | while read -r f; do
            if lipo -archs "$f" 2>/dev/null | grep -q " "; then
              lipo -archs "$f" | grep -qw x86_64 && lipo "$f" -thin x86_64 -output "$f.thin" && mv "$f.thin" "$f" && chmod +x "$f"
            fi
          done
          du -sh AnyPlay.app
          codesign --force --entitlements gui/entitlements.xml --deep --sign - AnyPlay.app
          rm -f chiaki-ng.dmg
          rm -rf dmgroot && mkdir dmgroot && cp -a AnyPlay.app dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname AnyPlay -srcfolder dmgroot -fs HFS+ -format UDZO chiaki-ng.dmg
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ng.dmg

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v7
        with:
          name: chiaki-ng-macos_x86_64-Release
          path: chiaki-ng.dmg
          if-no-files-found: error
          retention-days: 7
