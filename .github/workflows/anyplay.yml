name: AnyPlay — збірка chiaki-ng з мишею-стіком

on:
  push:
    branches: [anyplay]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/anyplay-android.yml'
  workflow_dispatch:
    inputs:
      platforms:
        description: "Що збирати: all — усе, mac — лише Mac (швидше), arm — лише Mac на процесорах M"
        type: choice
        options: [all, mac, arm]
        default: all
      arm_runner:
        description: "Машина GitHub для збірки Mac M (якщо на macos-15 черга)"
        type: string
        default: macos-15

permissions:
  contents: write

jobs:
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' }}
    uses: ./.github/workflows/build-windows-x86.yml
  macos:
    uses: ./.github/workflows/build-macos-arm.yml
    with:
      runner: ${{ inputs.arm_runner || 'macos-15' }}
  macos_intel:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms != 'arm' }}
    uses: ./.github/workflows/build-macos-x86.yml
  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' }}
    uses: ./.github/workflows/build-appimage-x64.yml

  release:
    needs: [windows, macos, macos_intel, linux]
    if: ${{ always() && (needs.windows.result == 'success' || needs.macos.result == 'success' || needs.macos_intel.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      # номер збірки — з anyplay-build.txt (той самий, що вшитий у програму й у встановлювач)
      - uses: actions/checkout@v7
        with:
          sparse-checkout: anyplay-build.txt
          sparse-checkout-cone-mode: false
      - name: Build number
        id: build
        run: |
          build=$(tr -d '[:space:]' < anyplay-build.txt)
          if [[ ! "$build" =~ ^[0-9]+$ ]]; then echo "У anyplay-build.txt має бути лише номер збірки"; exit 1; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: chiaki-ng-win_x64-VC-installer.zip
          path: out/win
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: chiaki-ng-macos_arm64-Release
          path: out/mac
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: chiaki-ng-macos_x86_64-Release
          path: out/mac-intel
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: chiaki-ng.AppImage_x86_64
          path: out/linux
      - name: Rename files
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          mkdir -p dist
          # для першого встановлення — як і раніше
          cp out/win/*.exe "dist/AnyPlay-chiaki-ng-Windows.exe" || true
          cp out/mac/*.dmg "dist/AnyPlay-chiaki-ng-Mac.dmg" || true
          cp out/mac-intel/*.dmg "dist/AnyPlay-chiaki-ng-Mac-Intel.dmg" || true
          cp out/linux/*.AppImage "dist/AnyPlay-chiaki-ng-Linux.AppImage" || true
          # для оновлення з програми: сервер шукає файли з номером збірки в назві
          cp out/win/*.exe "dist/AnyPlay-Windows-$BUILD.exe" || true
          cp "out/mac/AnyPlay-Mac-$BUILD.zip" dist/ || true
          cp "out/mac-intel/AnyPlay-Mac-Intel-$BUILD.zip" dist/ || true
          ls -la dist
      # make_latest: false — що з цього отримають клієнти, вирішує власник: «Опублікувати» в CRM
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: anyplay-r${{ github.run_number }}
          name: AnyPlay ${{ steps.build.outputs.build }} (збірка ${{ github.run_number }})
          make_latest: false
          body: |
            AnyPlay ${{ steps.build.outputs.build }} — програма для оренди PS5: вхід через Telegram, доступ лише в час оплаченої броні, якість, клавіші та свій акаунт PSN.
            Перше встановлення: Windows — AnyPlay-chiaki-ng-Windows.exe; Mac (Apple M1 і новіші) — AnyPlay-chiaki-ng-Mac.dmg; Mac (Intel) — AnyPlay-chiaki-ng-Mac-Intel.dmg; Linux / Steam Deck — AppImage.
            Файли з номером збірки (AnyPlay-Windows-${{ steps.build.outputs.build }}.exe, AnyPlay-Mac-${{ steps.build.outputs.build }}.zip, AnyPlay-Mac-Intel-${{ steps.build.outputs.build }}.zip) програма завантажує сама, коли оновлення опубліковано.
          files: dist/*
