name: AnyPlay — збірка chiaki-ng з мишею-стіком

on:
  push:
    branches: [anyplay]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/build-windows-x86.yml
  macos:
    uses: ./.github/workflows/build-macos-arm.yml
  linux:
    uses: ./.github/workflows/build-appimage-x64.yml

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chiaki-ng-win_x64-VC-installer.zip
          path: out/win
      - uses: actions/download-artifact@v4
        with:
          name: chiaki-ng-macos_arm64-Release
          path: out/mac
      - uses: actions/download-artifact@v4
        with:
          name: chiaki-ng.AppImage_x86_64
          path: out/linux
      - name: Rename files
        run: |
          mkdir -p dist
          cp out/win/*.exe "dist/AnyPlay-chiaki-ng-Windows.exe"
          cp out/mac/*.dmg "dist/AnyPlay-chiaki-ng-Mac.dmg"
          cp out/linux/*.AppImage "dist/AnyPlay-chiaki-ng-Linux.AppImage"
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: anyplay-${{ github.run_number }}
          name: AnyPlay chiaki-ng (збірка ${{ github.run_number }})
          make_latest: true
          body: |
            chiaki-ng з керуванням камерою мишею (режим Right Stick) і розкладкою клавіш у стилі GTA.
            Windows — AnyPlay-chiaki-ng-Windows.exe · Mac (Apple Silicon) — AnyPlay-chiaki-ng-Mac.dmg · Linux / Steam Deck — AppImage.
          files: dist/*
