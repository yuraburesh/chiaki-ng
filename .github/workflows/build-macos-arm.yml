name: Build chiaki-ng macOSX arm64

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Машина GitHub (macos-15, macos-14, macos-26)"
        type: string
        default: macos-15
  workflow_call:
    inputs:
      runner:
        type: string
        default: macos-15

permissions:
  contents: read

jobs:
  build-mac_arm64_github:
    name: Build macOSX arm64 version Github
    runs-on: ${{ inputs.runner || 'macos-15' }}
    env:
      # AnyPlay: на машині з macOS 26 ставимо бібліотеки Homebrew, зібрані для macOS 15, щоб програма запускалась і на macOS 15
      ANYPLAY_MACOS_TARGET: ${{ inputs.runner == 'macos-26' && '15.0' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install protobuf
        run: |
          pip3 install --user 'protobuf>=5,<6' --break-system-packages
      - name: Install brew dependencies
        run: |
          brew update
          brew uninstall pkgconfig || true
          if [[ -n "$ANYPLAY_MACOS_TARGET" ]]; then
            scripts/brew-bottles-for.sh arm64_sequoia qt@6 ffmpeg pkgconf opus openssl@3 protobuf@29 speexdsp libplacebo json-c miniupnpc libevent libidn2 libssh2 libnghttp2 libpsl
          fi
          brew install --force qt@6 ffmpeg pkgconfig opus openssl@3 cmake ninja nasm protobuf@29 speexdsp libplacebo wget python-setuptools json-c miniupnpc libevent
          # OpenSSL 4 headers in the Homebrew prefix would shadow openssl@3; the bundled curl needs 3
          brew unlink openssl@4 || true
          if [[ -n "$ANYPLAY_MACOS_TARGET" ]]; then
            minos() { otool -l "$1" 2>/dev/null | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit}'; }
            qt=$(find -L "$(brew --prefix)/opt/qtbase/lib" "$(brew --prefix)/opt/qt@6/lib" -path '*QtCore.framework/Versions/A/QtCore' -type f 2>/dev/null | head -1)
            for f in "$qt" "$(brew --prefix)/opt/ffmpeg/lib/libavcodec.dylib" "$(brew --prefix)/opt/openssl@3/lib/libssl.dylib"; do echo "minos $(minos "$f") $f"; done
            m=$(minos "$qt"); if [[ -z "$m" || "${m%%.*}" -gt "${ANYPLAY_MACOS_TARGET%%.*}" ]]; then echo "Qt зібрано для новішої macOS ($m), зупиняюсь"; exit 1; fi
          fi

      - name: Install sdl2-compat
        run: |
          if [[ -n "$ANYPLAY_MACOS_TARGET" ]]; then
            sudo MACOSX_DEPLOYMENT_TARGET="$ANYPLAY_MACOS_TARGET" INSTALL_PREFIX=/usr/local scripts/build-sdl2-compat.sh
          else
            sudo INSTALL_PREFIX=/usr/local scripts/build-sdl2-compat.sh
          fi
          sudo cp /usr/local/lib/pkgconfig/sdl2-compat.pc /usr/local/lib/pkgconfig/sdl2.pc

      # AnyPlay 116: джерела libdatachannel (трансляція друзям) — фіксована версія, з кешу GitHub;
      # без кешу — клон з повторами й перевіркою коміту (scripts/anyplay-fetch-libdatachannel.sh)
      - name: Restore libdatachannel sources
        id: ldc-cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ldc-src
          key: libdatachannel-v0.24.6-6b1e2e620f1e37f0eafeee702eaea0043cb305fd-v1

      - name: Fetch libdatachannel sources
        if: ${{ steps.ldc-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: scripts/anyplay-fetch-libdatachannel.sh "$GITHUB_WORKSPACE/ldc-src"

      - name: Configure chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DANYPLAY_LIVE=ON -DFETCHCONTENT_SOURCE_DIR_LIBDATACHANNEL="$GITHUB_WORKSPACE/ldc-src" -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF -DOPENSSL_ROOT_DIR="$(brew --prefix)/opt/openssl@3" -DOPENSSL_INCLUDE_DIR="$(brew --prefix)/opt/openssl@3/include" -DOPENSSL_CRYPTO_LIBRARY="$(brew --prefix)/opt/openssl@3/lib/libcrypto.dylib" -DOPENSSL_SSL_LIBRARY="$(brew --prefix)/opt/openssl@3/lib/libssl.dylib" -DCMAKE_PREFIX_PATH="$(brew --prefix)/opt/openssl@3;$(brew --prefix)/opt/qt@6;$(brew --prefix)/opt/protobuf@29"

      - name: Build chiaki-ng
        run: |
          export CPATH=$(brew --prefix)/opt/ffmpeg/include
          cmake --build build --config Release --clean-first --target chiaki

      - name: Deploy chiaki-ng
        run: |
          rm -rf AnyPlay.app chiaki-ng.dmg
          cp -a build/gui/chiaki.app AnyPlay.app
          cp scripts/qtwebengine_import.qml gui/src/qml/
          $(brew --prefix)/opt/qt@6/bin/macdeployqt AnyPlay.app -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib
          mkdir -p AnyPlay.app/Contents/Resources/vulkan/icd.d
          wget https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-macos.tar && tar xf MoltenVK-macos.tar
          cp MoltenVK/MoltenVK/dynamic/dylib/macOS/* AnyPlay.app/Contents/Resources/vulkan/icd.d
          $(brew --prefix)/opt/qt@6/bin/macdeployqt AnyPlay.app -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib
          if [[ -d AnyPlay.app/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app ]]
          then
            ln -s ../../../../../../../Frameworks AnyPlay.app/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app/Contents
          fi
          cp /usr/local/lib/libSDL3.dylib AnyPlay.app/Contents/MacOS/libSDL3.dylib
          cp /usr/local/lib/libSDL2-2.0.0.dylib AnyPlay.app/Contents/MacOS/libSDL2-2.0.0.dylib
          install_name_tool -id @executable_path/libSDL3.dylib AnyPlay.app/Contents/MacOS/libSDL3.dylib
          install_name_tool -id @executable_path/libSDL2-2.0.0.dylib AnyPlay.app/Contents/MacOS/libSDL2-2.0.0.dylib
          install_name_tool -change /usr/local/lib/libSDL3.dylib @executable_path/libSDL3.dylib AnyPlay.app/Contents/MacOS/libSDL2-2.0.0.dylib || true
          install_name_tool -change @rpath/libSDL3.dylib @executable_path/libSDL3.dylib AnyPlay.app/Contents/MacOS/libSDL2-2.0.0.dylib || true
          install_name_tool -change /opt/homebrew/lib/libSDL3.dylib @executable_path/libSDL3.dylib AnyPlay.app/Contents/MacOS/libSDL2-2.0.0.dylib || true
          install_name_tool -change /usr/local/lib/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib AnyPlay.app/Contents/MacOS/chiaki || true
          install_name_tool -change @rpath/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib AnyPlay.app/Contents/MacOS/chiaki || true
          install_name_tool -change /opt/homebrew/lib/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib AnyPlay.app/Contents/MacOS/chiaki || true
          ln -s libvulkan.1.dylib AnyPlay.app/Contents/Frameworks/vulkan
          # AnyPlay: усі бібліотеки — лише всередині програми (у клієнтів немає MacPorts/Homebrew)
          rm -f AnyPlay.app/Contents/PlugIns/sqldrivers/libqsqlmimer.dylib AnyPlay.app/Contents/PlugIns/sqldrivers/libqsqlodbc.dylib AnyPlay.app/Contents/PlugIns/sqldrivers/libqsqlpsql.dylib
          for pass in 1 2 3 4; do
            changed=0
            while IFS= read -r f; do
              for dep in $(otool -L "$f" 2>/dev/null | tail -n +2 | awk '{print $1}' | grep -E '^/(opt/local|usr/local|opt/homebrew)/' || true); do
                if [[ "$dep" == *.framework/* ]]; then
                  # фреймворк Qt уже лежить у програмі — лише виправляємо посилання (без копії)
                  fw=$(echo "$dep" | sed -E 's|^.*/([^/]+\.framework/.*)$|\1|')
                  if [[ -e "AnyPlay.app/Contents/Frameworks/$fw" ]]; then
                    if [[ "$f" == *QtWebEngineProcess* ]]; then new="@rpath/$fw"; else new="@executable_path/../Frameworks/$fw"; fi
                    echo "fix-fw: $f -> $new"
                    install_name_tool -change "$dep" "$new" "$f"
                    changed=1
                    continue
                  fi
                fi
                base=$(basename "$dep")
                if [[ ! -e "AnyPlay.app/Contents/Frameworks/$base" ]]; then
                  cp -L "$dep" "AnyPlay.app/Contents/Frameworks/$base"
                  chmod u+w "AnyPlay.app/Contents/Frameworks/$base"
                  install_name_tool -id "@loader_path/$base" "AnyPlay.app/Contents/Frameworks/$base"
                fi
                # короткий шлях (@loader_path) вміщується в заголовок бібліотеки, довгий — ні
                if [[ "$(dirname "$f")" == "AnyPlay.app/Contents/Frameworks" ]]; then new="@loader_path/$base"; else new="@executable_path/../Frameworks/$base"; fi
                echo "fix: $f -> $new"
                install_name_tool -change "$dep" "$new" "$f"
                changed=1
              done
            done < <(find AnyPlay.app/Contents/Frameworks AnyPlay.app/Contents/MacOS AnyPlay.app/Contents/PlugIns -type f \( -name '*.dylib' -o -perm -u+x \))
            [[ $changed = 0 ]] && break
          done
          bad=$(find AnyPlay.app/Contents -type f \( -name '*.dylib' -o -perm -u+x \) -exec otool -L {} \; 2>/dev/null | grep -E '^[[:space:]]+/(opt/local|usr/local|opt/homebrew)/' || true)
          if [[ -n "$bad" ]]; then echo "Залишились зовнішні бібліотеки:"; echo "$bad"; exit 1; fi
          # AnyPlay: лишаємо в бібліотеках тільки одну архітектуру — файл удвічі менший
          find AnyPlay.app -type f | while read -r f; do
            if lipo -archs "$f" 2>/dev/null | grep -q " "; then
              lipo -archs "$f" | grep -qw arm64 && lipo "$f" -thin arm64 -output "$f.thin" && mv "$f.thin" "$f" && chmod +x "$f"
            fi
          done
          du -sh AnyPlay.app
          if [[ -n "$ANYPLAY_MACOS_TARGET" ]]; then
            # жоден файл у програмі не має вимагати новішої macOS, ніж обіцяє Info.plist
            newer=$(find AnyPlay.app -type f \( -name '*.dylib' -o -perm -u+x \) | while read -r f; do m=$(otool -l "$f" 2>/dev/null | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit}'); if [[ -n "$m" && "${m%%.*}" -gt "${ANYPLAY_MACOS_TARGET%%.*}" ]]; then echo "$m $f"; fi; done)
            if [[ -n "$newer" ]]; then echo "Файли для новішої macOS:"; echo "$newer"; exit 1; fi
            grep -A1 LSMinimumSystemVersion AnyPlay.app/Contents/Info.plist
          fi
          codesign --force --entitlements gui/entitlements.xml --deep --sign - AnyPlay.app
          rm -f chiaki-ng.dmg
          rm -rf dmgroot && mkdir dmgroot && cp -a AnyPlay.app dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname AnyPlay -srcfolder dmgroot -fs HFS+ -format UDZO chiaki-ng.dmg
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ng.dmg
          # AnyPlay: архів для оновлення з програми (ditto зберігає підпис, права й посилання всередині програми)
          build=$(tr -d '[:space:]' < anyplay-build.txt)
          if [[ ! "$build" =~ ^[0-9]+$ ]]; then echo "У anyplay-build.txt має бути лише номер збірки"; exit 1; fi
          rm -f AnyPlay-Mac-*.zip
          ditto -c -k --keepParent AnyPlay.app "AnyPlay-Mac-${build}.zip"
          # той самий шлях, що й у програмі: розпакувати й перевірити підпис.
          # Якщо підпис не сходиться, програма відмовиться ставити такий архів — тож його й не публікуємо (DMG лишається)
          rm -rf ziptest && mkdir ziptest
          if ditto -x -k "AnyPlay-Mac-${build}.zip" ziptest && codesign --verify --deep ziptest/AnyPlay.app; then
            ls -la AnyPlay-Mac-*.zip
          else
            echo "::error::Підпис програми в AnyPlay-Mac-${build}.zip не сходиться, архів для оновлення не публікуємо"
            rm -f AnyPlay-Mac-*.zip
          fi
          rm -rf ziptest

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v7
        with:
          name: chiaki-ng-macos_arm64-Release
          path: |
            chiaki-ng.dmg
            AnyPlay-Mac-*.zip
          if-no-files-found: error
          retention-days: 7
