name: AnyPlay Android

on:
  workflow_dispatch:
  push:
    branches: [anyplay]
    paths:
      - 'android/**'
      - '.github/workflows/anyplay-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Залежності
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build protobuf-compiler python3-protobuf
          pip3 install --user --break-system-packages protobuf grpcio-tools || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: Збірка APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.injected.build.abi=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: anyplay-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
