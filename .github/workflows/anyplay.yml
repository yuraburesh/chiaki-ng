name: AnyPlay — збірка chiaki-ng з мишею-стіком

on:
  push:
    branches: [anyplay]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Що збирати: all — усе, mac — лише Mac (швидше)"
        type: choice
        options: [all, mac]
        default: all

permissions:
  contents: write

jobs:
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' }}
    uses: ./.github/workflows/build-windows-x86.yml
  macos:
    uses: ./.github/workflows/build-macos-arm.yml
  macos_intel:
    uses: ./.github/workflows/build-macos-x86.yml
  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' }}
    uses: ./.github/workflows/build-appimage-x64.yml

  release:
    needs: [windows, macos, macos_intel, linux]
    if: ${{ always() && (needs.windows.result == 'success' || needs.macos.result == 'success' || needs.macos_intel.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: chiaki-ng-win_x64-VC-installer.zip
          path: out/win
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: chiaki-ng-macos_arm64-Release
          path: out/mac
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: chiaki-ng-macos_x86_64-Release
          path: out/mac-intel
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: chiaki-ng.AppImage_x86_64
          path: out/linux
      - name: Rename files
        run: |
          mkdir -p dist
          cp out/win/*.exe "dist/AnyPlay-chiaki-ng-Windows.exe" || true
          cp out/mac/*.dmg "dist/AnyPlay-chiaki-ng-Mac.dmg" || true
          cp out/mac-intel/*.dmg "dist/AnyPlay-chiaki-ng-Mac-Intel.dmg" || true
          cp out/linux/*.AppImage "dist/AnyPlay-chiaki-ng-Linux.AppImage" || true
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: anyplay-${{ github.run_number }}
          name: AnyPlay chiaki-ng (збірка ${{ github.run_number }})
          make_latest: true
          body: |
            AnyPlay — програма для оренди PS5: вхід через Telegram, доступ лише в час оплаченої броні, якість, клавіші та свій акаунт PSN.
            Windows — AnyPlay-chiaki-ng-Windows.exe · Mac (Apple M1 і новіші) — AnyPlay-chiaki-ng-Mac.dmg · Mac (Intel) — AnyPlay-chiaki-ng-Mac-Intel.dmg · Linux / Steam Deck — AppImage.
          files: dist/*
