name: AnyPlay Android

on:
  workflow_dispatch:
  push:
    branches: [anyplay]
    paths:
      - 'android/**'
      - 'anyplay-build.txt'
      - '.github/workflows/anyplay-android.yml'

# реліз з APK для оновлення всередині програми
permissions:
  contents: write

# новіший push зупиняє ще не завершену збірку старішого
concurrency:
  group: anyplay-android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  android:
    # мітки в повідомленні коміту: якщо є [win] [mac] [arm] [intel] [linux], а [android] немає — Android не збираємо
    # (як і в anyplay.yml: мітки = «збирати лише це»); без міток — як завжди, за зміненими файлами
    if: >-
      ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[android]') ||
      !(contains(github.event.head_commit.message, '[win]') || contains(github.event.head_commit.message, '[mac]') ||
      contains(github.event.head_commit.message, '[arm]') || contains(github.event.head_commit.message, '[intel]') ||
      contains(github.event.head_commit.message, '[linux]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # кеш Gradle (обгортка й бібліотеки) між збірками: ~1 хв замість завантаження щоразу
          cache: gradle
      - name: Номер збірки
        id: build
        run: |
          BUILD="$(tr -d '[:space:]' < anyplay-build.txt)"
          if ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::anyplay-build.txt має містити лише число, а там: '$BUILD'"
            exit 1
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "notes=$(head -c 600 anyplay-notes.txt 2>/dev/null | tr '\n' ' ' | sed 's/  */ /g')" >> "$GITHUB_OUTPUT"
          echo "Збірка AnyPlay: $BUILD"
      - name: Залежності
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build protobuf-compiler python3-protobuf
          pip3 install --user --break-system-packages protobuf grpcio-tools || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: Ключ підпису
        env:
          ANYPLAY_KS: ${{ secrets.ANYPLAY_ANDROID_KEYSTORE }}
          ANYPLAY_KS_PW: ${{ secrets.ANYPLAY_ANDROID_KEYSTORE_PW }}
        run: |
          if [ -n "$ANYPLAY_KS" ] && [ -n "$ANYPLAY_KS_PW" ]; then
            echo "$ANYPLAY_KS" | base64 -d > "$RUNNER_TEMP/anyplay.jks"
            printf 'chiakiKeystore=%s\nchiakiKeystorePW=%s\nchiakiKeyAlias=anyplay\nchiakiKeyPW=%s\n' "$RUNNER_TEMP/anyplay.jks" "$ANYPLAY_KS_PW" "$ANYPLAY_KS_PW" > android/local.properties
            echo "Підпис: постійний ключ AnyPlay"
          elif [ "$GITHUB_REF" = "refs/heads/anyplay" ]; then
            # APK з тимчасовим ключем не стане поверх установленої програми — такий реліз не публікуємо ніколи
            echo "::error::Немає секретів ANYPLAY_ANDROID_KEYSTORE / ANYPLAY_ANDROID_KEYSTORE_PW: збірку з гілки anyplay не можна підписати постійним ключем"
            exit 1
          else
            echo "Підпис: тимчасовий ключ (секрети не додані) - таку збірку не можна встановити поверх попередньої, реліз не створюється"
          fi
      - name: Збірка APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          find app/build -name "*.apk" -exec ls -la {} \;
      - name: Перевірка підпису
        id: apk
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          set -o pipefail
          APK="$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)"
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if [ -f android/local.properties ] && grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK підписано тимчасовим ключем, а не постійним ключем AnyPlay"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/AnyPlay-Android-$BUILD.apk"
          ls -la dist
          sha256sum "dist/AnyPlay-Android-$BUILD.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: anyplay-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Чи публікувати реліз
        id: publish
        run: |
          if [ "$GITHUB_REF" = "refs/heads/anyplay" ] && [ -f android/local.properties ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Реліз не створюється: це не гілка anyplay або APK без постійного ключа"
          fi
      - uses: softprops/action-gh-release@v2
        if: ${{ steps.publish.outputs.ok == 'true' }}
        with:
          tag_name: anyplay-android-r${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: AnyPlay для Android (збірка ${{ steps.build.outputs.build }})
          make_latest: false
          body: |
            Що нового: ${{ steps.build.outputs.notes }}
            AnyPlay для Android, збірка ${{ steps.build.outputs.build }}.
            Програма оновлюється сама після публікації в CRM. Вручну: завантаж AnyPlay-Android-${{ steps.build.outputs.build }}.apk і встанови поверх попередньої версії.
          files: dist/AnyPlay-Android-${{ steps.build.outputs.build }}.apk
