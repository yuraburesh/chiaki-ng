<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AnyPlay</title>
<style>
:root{--bg:#0b0618;--panel:#160d2b;--panel2:#1f1240;--line:#ffffff1f;--text:#fff6ff;--dim:#bfaed8;
  --pink:#ff2e9a;--orange:#ff9a3c;--cyan:#22e4ff;--violet:#7b2cff;--green:#3dff9a;--red:#ff5c7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Roboto,sans-serif}
body{min-height:100vh;padding:0 0 calc(104px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 60% at 50% -10%,#3a0f5e 0,#1a0b33 45%,var(--bg) 75%) fixed}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:#1a0b33f2;border-bottom:1px solid var(--line)}
header button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#ffffff14;color:#fff;font-size:20px}
header h1{flex:1;margin:0;font-size:19px;font-weight:800}
.wrap{max-width:640px;margin:0 auto}
.tabs{display:flex;gap:8px;margin:14px 14px 0}
.tab{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-weight:800;text-align:center;font-size:14px}
.tab.on{color:#fff;background:linear-gradient(90deg,var(--pink),var(--violet));border-color:transparent}
section{margin:18px 14px 0}
h2{font-size:16px;font-weight:800;margin:0 0 10px}
h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;border-radius:7px;font-size:13px;
  background:linear-gradient(135deg,var(--cyan),var(--violet))}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:72px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:center;font-weight:800;font-size:15px}
.chip small{display:block;font-size:11px;color:var(--dim);font-weight:700;margin-top:2px}
.chip.on{background:linear-gradient(135deg,var(--orange),var(--pink));border-color:transparent}
.chip.on small{color:#fff}
.chip.off{opacity:.35}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 66px;padding:10px 0;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center}
.day b{display:block;font-size:22px}
.day span{font-size:12px;color:var(--dim);font-weight:700}
.day.on{background:linear-gradient(160deg,var(--cyan),var(--violet));border-color:transparent}
.day.on span{color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.slot{padding:10px 0;border-radius:12px;text-align:center;font-weight:800;font-size:15px;background:var(--panel2);border:1px solid #22e4ff55}
.slot small{display:block;font-size:10px;color:var(--dim);font-weight:700}
.slot.on{background:linear-gradient(135deg,var(--pink),var(--orange));border-color:transparent}
.slot.on small{color:#fff}
.note{padding:14px;border-radius:14px;background:var(--panel);color:var(--dim);font-weight:600;font-size:14px;line-height:1.45}
.note b{color:#fff}
.card{border-radius:18px;padding:14px;background:linear-gradient(160deg,#241046,#160d2b);border:1px solid var(--line);margin-bottom:10px}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card b.t{font-size:16px}
.card .when{color:var(--dim);font-weight:700;font-size:13.5px;margin-top:3px}
.st{flex:0 0 auto;padding:4px 9px;border-radius:9px;font-size:12px;font-weight:800;background:#ffffff1a}
.st.paid{background:#3dff9a26;color:var(--green)}
.st.hold{background:#ff9a3c2e;color:var(--orange)}
.st.rev{background:#22e4ff26;color:var(--cyan)}
.meta{color:var(--dim);font-size:13px;line-height:1.45;margin-top:8px}
.meta b{color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.b{flex:1;min-width:120px;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:#ffffff14;color:#fff;font-weight:800;font-size:14px;text-align:center}
.b.ok{background:linear-gradient(90deg,var(--orange),var(--pink),var(--violet));border-color:transparent}
.b.bad{color:var(--red);border-color:#ff5c7a55}
.b[disabled]{opacity:.45}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#0b0618f2;border-top:1px solid var(--line)}
.bar .in{max-width:640px;margin:0 auto}
.big{display:block;width:100%;padding:16px;border-radius:16px;border:0;color:#fff;font-weight:800;font-size:17px;
  background:linear-gradient(90deg,var(--orange),var(--pink),var(--violet))}
.big[disabled]{opacity:.45}
.barhint{color:var(--dim);font-size:12.5px;text-align:center;margin-bottom:8px;font-weight:600}
.hidden{display:none!important}
#sheet{position:fixed;inset:0;z-index:10;background:#0b0618;overflow-y:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.amount{font-size:34px;font-weight:800;text-align:center;margin:6px 0 2px}
.sub{text-align:center;color:var(--dim);font-weight:700;font-size:14px}
.req{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed #ffffff1a}
.req:last-child{border-bottom:0}
.req .l{flex:1;min-width:0}
.req .l span{display:block;color:var(--dim);font-size:12px;font-weight:700}
.req .l b{display:block;font-size:16px;word-break:break-all}
.req button{flex:0 0 auto;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:#ffffff14;color:#fff;font-weight:800;font-size:13px}
input{width:100%;padding:13px 14px;border-radius:13px;border:1px solid #ffffff33;background:#0b0618;color:#fff;font:inherit;font-size:15px}
#toast{position:fixed;left:14px;right:14px;bottom:calc(120px + env(safe-area-inset-bottom));z-index:20;padding:13px 16px;border-radius:14px;background:#2a1650;border:1px solid #ffffff33;
  font-weight:700;font-size:14px;text-align:center;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid #ffffff33;border-top-color:var(--pink);margin:18px auto;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.code{font-size:30px;font-weight:800;letter-spacing:5px;text-align:center;padding:12px;border-radius:14px;background:#0b0618;border:1px solid #ffffff33;margin:10px 0}
ol{margin:8px 0 0;padding-left:20px;color:var(--dim);font-size:14px;line-height:1.5}
ol b{color:#fff}
</style>
</head>
<body>
<header><button id="back" aria-label="Назад">‹</button><h1 id="title">AnyPlay</h1></header>
<div class="wrap">
  <div id="loading"><div class="spin"></div></div>

  <!-- бронювання -->
  <div id="vBook" class="hidden">
    <div class="tabs"><div class="tab on" id="tabNew">Забронювати</div><div class="tab" id="tabMine">Мої броні</div></div>
    <div id="pNew">
      <section id="fullNote" class="hidden"><div class="note" id="fullText"></div></section>
      <div id="picker">
        <section><h2><span class="n">1</span>Скільки граємо</h2><div class="chips" id="tariffs"></div></section>
        <section><h2><span class="n">2</span>День</h2><div class="days" id="days"></div></section>
        <section><h2><span class="n">3</span>Початок</h2><div class="grid" id="starts"></div>
          <div class="meta" id="tzNote"></div></section>
        <section id="methodsWrap"><h2><span class="n">4</span>Оплата</h2><div class="chips" id="methods"></div></section>
      </div>
    </div>
    <div id="pMine" class="hidden"><section id="mine"></section></div>
  </div>

  <!-- продовження -->
  <div id="vExtend" class="hidden">
    <section><div class="note" id="extInfo"></div></section>
    <section id="extPending" class="hidden"></section>
    <div id="extPick">
      <section><h2><span class="n">1</span>На скільки продовжити</h2><div class="chips" id="extHours"></div></section>
      <section id="extMethodsWrap"><h2><span class="n">2</span>Оплата</h2><div class="chips" id="extMethods"></div></section>
    </div>
  </div>

  <!-- свій PSN -->
  <div id="vPsn" class="hidden"><section id="psn"></section></div>

  <!-- як керувати приставкою -->
  <div id="vHelp" class="hidden"><section id="help"></section></div>
</div>

<div class="bar hidden" id="bar"><div class="in"><div class="barhint" id="barHint"></div><button class="big" id="barBtn"></button></div></div>

<!-- оплата -->
<div id="sheet" class="hidden">
  <header><button id="sheetBack" aria-label="Назад">‹</button><h1>Оплата</h1></header>
  <div class="wrap">
    <section>
      <div class="sub" id="payWhen"></div>
      <div class="amount" id="payAmount"></div>
      <div class="sub" id="payTimer"></div>
    </section>
    <section><div class="card" id="payReq"></div></section>
    <section id="payForm">
      <div class="meta" style="margin:0 0 8px">Ім'я відправника платежу (необов'язково, допомагає швидше знайти оплату)</div>
      <input id="paySender" maxlength="60" autocomplete="off">
      <div class="btns"><button class="b ok" id="payDone">✅ Я оплатив</button></div>
      <div class="btns"><button class="b bad" id="payCancel">Скасувати цю бронь</button></div>
    </section>
    <section id="payWait" class="hidden"><div class="note" id="payWaitText"></div><div class="spin"></div></section>
    <section id="payOk" class="hidden"><div class="note" id="payOkText"></div><div class="btns"><button class="b ok" id="payClose">Готово</button></div></section>
  </div>
</div>
<div id="toast"></div>

<script>
// ── міст до програми (на Android його дає сама програма; у браузері для перевірки — прямий запит) ──
const native = window.AnyPlay || null;
const waiting = {}; let reqId = 0;
window.__anyplayResp = (id, status, text) => { const w = waiting[id]; if(!w) return; delete waiting[id];
  let json = {}; try { json = JSON.parse(text || '{}'); } catch(e) {} w({status, json}); };
function api(method, path, body){
  if(native) return new Promise(res => { const id = ++reqId; waiting[id] = res; native.req(id, method, path, body ? JSON.stringify(body) : ''); });
  const q = new URLSearchParams(location.search);
  return fetch((window.ANYPLAY_API || '') + path, {method, headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (q.get('t') || '')},
    body: method === 'GET' ? undefined : JSON.stringify(body || {})}).then(async r => ({status: r.status, json: await r.json().catch(() => ({}))}))
    .catch(() => ({status: 0, json: {}}));
}
const $ = id => document.getElementById(id);
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), Math.max(2800, String(t).length * 55)); }
function haptic(){ try { native && native.haptic(); } catch(e) {} }
function copy(t){ if(native) native.copy(String(t)); else if(navigator.clipboard) navigator.clipboard.writeText(String(t)); toast('Скопійовано: ' + t); }
function openUrl(u){ if(native) native.open(u); else window.open(u, '_blank'); }
function closeApp(){ if(native) native.close(); else history.back(); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const WD = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'], MON = ['січ','лют','бер','квіт','трав','черв','лип','серп','вер','жовт','лист','груд'];
let skew = 0;   // час сервера мінус час телефона, с
const nowTs = () => Math.floor(Date.now() / 1000) + skew;
function hm(ts){ const d = new Date(ts * 1000); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function dayName(ts){ const d = new Date(ts * 1000), a = new Date(), b = new Date(Date.now() + 864e5);
  const same = (x, y) => x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate();
  return same(d, a) ? 'сьогодні' : same(d, b) ? 'завтра' : WD[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
function range(a, b){ return dayName(a) + ', ' + hm(a) + '–' + hm(b); }
function hoursWord(n){ return n % 10 == 1 && n % 100 != 11 ? 'година' : (n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14) ? 'години' : 'годин'); }
const ERR = {busy: 'Цей час щойно зайняли. Обери інший.', limit: 'У тебе вже максимум броней. Спершу зіграй або скасуй одну з них.',
  closed: 'Зараз технічні роботи, бронювання тимчасово закрите.', pending: 'Попереднє продовження ще перевіряється. Зачекай хвилину.',
  no_session: 'Продовжити можна лише під час гри.', status: 'Цю бронь уже не можна оплатити.', auth: 'Вхід застарів. Увійди через Telegram знову.'};
function errText(r){ return r.json.text || ERR[r.json.error] || (r.status === 0 ? 'Немає зв\'язку з сервером. Перевір інтернет.' : 'Не вдалося (помилка ' + r.status + '). Спробуй ще раз.'); }

const HASH = (location.hash || '#book').slice(1), MODE = HASH === 'extend' || HASH === 'psn' || HASH === 'help' ? HASH : 'book';
let B = null, tab = 'new', code = null, dayIdx = 0, starts = null, start = 0, method = null, busy = false;

function show(view){ ['vBook','vExtend','vPsn','vHelp'].forEach(v => $(v).classList.toggle('hidden', v !== view)); $('loading').classList.add('hidden'); }
function bar(text, hint, enabled, fn){ $('bar').classList.remove('hidden'); $('barBtn').textContent = text; $('barHint').textContent = hint || '';
  $('barHint').classList.toggle('hidden', !hint); $('barBtn').disabled = !enabled; $('barBtn').onclick = fn; }
function hideBar(){ $('bar').classList.add('hidden'); }

// ── бронювання ──
async function loadBook(keep){
  const r = await api('GET', '/api/app/book');
  if(r.status !== 200 || !r.json.ok){ $('loading').innerHTML = '<section><div class="note">' + esc(errText(r)) + '</div></section>'; return; }
  B = r.json; skew = B.now - Math.floor(Date.now() / 1000);
  if(!method || !B.methods.some(m => m.code === method)) method = B.methods.length ? B.methods[0].code : null;
  if(!code || !B.tariffs.some(t => t.code === code)) code = B.tariffs.length ? B.tariffs[0].code : null;
  if(!keep){ starts = null; start = 0; }
  show('vBook'); renderBook();
  if(!keep) loadStarts();
}
async function loadStarts(){
  starts = null; start = 0; renderStarts(); renderBar();
  if(!code || !B.days[dayIdx]) return;
  const want = code + '|' + dayIdx;
  const r = await api('GET', '/api/app/book/starts?day=' + encodeURIComponent(B.days[dayIdx].date) + '&code=' + encodeURIComponent(code));
  if(want !== code + '|' + dayIdx) return;
  starts = r.json.ok ? r.json.starts : [];
  renderStarts(); renderBar();
}
function tariff(){ return B.tariffs.find(t => t.code === code); }
function renderBook(){
  $('title').textContent = 'Бронювання';
  $('tabNew').classList.toggle('on', tab === 'new'); $('tabMine').classList.toggle('on', tab === 'mine');
  $('tabMine').textContent = 'Мої броні' + (B.mine.length ? ' (' + B.mine.length + ')' : '');
  $('pNew').classList.toggle('hidden', tab !== 'new'); $('pMine').classList.toggle('hidden', tab !== 'mine');
  const full = B.openCount >= B.limit, closed = B.closed;
  $('fullNote').classList.toggle('hidden', !(full || closed)); $('picker').classList.toggle('hidden', full || closed);
  $('fullText').innerHTML = closed ? 'Зараз технічні роботи, бронювання тимчасово закрите. Спробуй трохи пізніше.'
    : 'У тебе вже <b>' + B.openCount + ' з ' + B.limit + '</b> броней: це максимум. Нову можна додати після гри або якщо скасуєш одну з них у вкладці «Мої броні».';
  const tEl = $('tariffs'); tEl.innerHTML = '';
  B.tariffs.forEach(t => { const c = document.createElement('div'); c.className = 'chip' + (t.code === code ? ' on' : '');
    c.innerHTML = (t.fixed || !/^h\d+$/.test(t.code) ? esc(t.title) : t.hours + ' год') + '<small>' + esc(t.prices[method] || '') + '</small>';
    c.onclick = () => { code = t.code; haptic(); renderBook(); loadStarts(); }; tEl.appendChild(c); });
  const dEl = $('days'); dEl.innerHTML = '';
  B.days.forEach((d, i) => { const dt = new Date(d.date + 'T12:00:00'); const c = document.createElement('div'); c.className = 'day' + (i === dayIdx ? ' on' : '');
    c.innerHTML = '<span>' + (i === 0 ? 'Сьогодні' : i === 1 ? 'Завтра' : WD[dt.getDay()]) + '</span><b>' + dt.getDate() + '</b><span>' + MON[dt.getMonth()] + '</span>';
    c.onclick = () => { dayIdx = i; haptic(); renderBook(); loadStarts(); }; dEl.appendChild(c); });
  $('methodsWrap').classList.toggle('hidden', B.methods.length < 2);
  const mEl = $('methods'); mEl.innerHTML = '';
  B.methods.forEach(m => { const c = document.createElement('div'); c.className = 'chip' + (m.code === method ? ' on' : '');
    const t = tariff(); c.innerHTML = esc(m.label) + '<small>' + esc(t ? t.prices[m.code] || '' : '') + '</small>';
    c.onclick = () => { method = m.code; haptic(); renderBook(); }; mEl.appendChild(c); });
  renderStarts(); renderMine(); renderBar();
}
function renderStarts(){
  const el = $('starts'), t = tariff(); el.innerHTML = '';
  $('tzNote').textContent = 'Час показано за годинником твого телефона.';
  if(starts === null){ el.innerHTML = '<div class="note" style="grid-column:1/-1">Шукаємо вільний час…</div>'; return; }
  if(!starts.length){ el.innerHTML = '<div class="note" style="grid-column:1/-1">На цей день такий час уже не вміщується. Обери інший день або меншу тривалість.</div>'; return; }
  starts.forEach(s => { const c = document.createElement('div'); c.className = 'slot' + (s === start ? ' on' : '');
    c.innerHTML = hm(s) + '<small>до ' + hm(s + (t ? t.hours * 3600 : 0)) + '</small>';
    c.onclick = () => { start = s === start ? 0 : s; haptic(); renderStarts(); renderBar(); }; el.appendChild(c); });
}
function renderBar(){
  if(MODE !== 'book') return;
  if(tab !== 'new' || B.openCount >= B.limit || B.closed){ hideBar(); return; }
  const t = tariff();
  if(!start || !t){ bar('Обери час початку', '', false, null); return; }
  bar('Забронювати за ' + (t.prices[method] || ''), range(start, start + t.hours * 3600) + '. Місце тримаємо ' + B.holdMinutes + ' хв, поки оплачуєш.', !busy, book);
}
async function book(){
  if(busy) return; busy = true; renderBar();
  const r = await api('POST', '/api/app/book', {code, start, method});
  busy = false;
  if(r.status !== 200 || !r.json.ok){ toast(errText(r)); await loadBook(true); loadStarts(); return; }
  haptic(); start = 0; openPay(r.json.pending, 'book');
  loadBook(true); loadStarts();
}
const ST = {hold: ['hold', 'Чекає оплати'], pending_review: ['rev', 'Перевіряємо оплату'], paid: ['paid', 'Оплачено'], active: ['paid', 'Зараз граєш']};
let confirmId = 0;
function renderMine(){
  const el = $('mine'); el.innerHTML = '';
  if(!B.mine.length){ el.innerHTML = '<div class="note">Броней поки немає. Обери час у вкладці «Забронювати».</div>'; return; }
  B.mine.forEach(m => { const st = ST[m.status] || ['', m.status]; const c = document.createElement('div'); c.className = 'card';
    let h = '<div class="top"><div><b class="t">' + esc(m.title) + '</b><div class="when">' + esc(range(m.start, m.end)) + ', ' + esc(m.price) + '</div></div><span class="st ' + st[0] + '">' + st[1] + '</span></div>';
    if(m.extPending) h += '<div class="meta">Продовження до ' + hm(m.extPending.end) + ' за ' + esc(m.extPending.price) + ': ' + (m.extPending.status === 'hold' ? 'чекає оплати' : 'перевіряємо оплату') + '.</div>';
    if(m.cancelNote) h += '<div class="meta">' + esc(m.cancelNote) + '</div>';
    h += '<div class="btns">';
    if(m.pending && m.status === 'hold') h += '<button class="b ok" data-pay="' + m.id + '">Оплатити</button>';
    if(m.pending && m.status === 'pending_review') h += '<button class="b" data-pay="' + m.id + '">Реквізити</button>';
    if(m.canCancel) h += confirmId === m.id ? '<button class="b bad" data-yes="' + m.id + '">Так, скасувати</button><button class="b" data-no="1">Ні, залишити</button>'
      : '<button class="b bad" data-cancel="' + m.id + '">Скасувати бронь</button>';
    h += '</div>'; c.innerHTML = h; el.appendChild(c); });
  el.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => { const m = B.mine.find(x => x.id == b.dataset.pay); if(m) openPay(m.pending, 'book'); });
  el.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { confirmId = +b.dataset.cancel; renderMine(); });
  el.querySelectorAll('[data-no]').forEach(b => b.onclick = () => { confirmId = 0; renderMine(); });
  el.querySelectorAll('[data-yes]').forEach(b => b.onclick = () => cancelBooking(+b.dataset.yes));
}
async function cancelBooking(id){
  confirmId = 0;
  const r = await api('POST', '/api/app/book/cancel', {bookingId: id});
  toast(r.json.text || errText(r));
  if(r.json.refund === 'bot') setTimeout(() => openUrl('https://t.me/play_any_bot'), 1500);
  if(MODE === 'extend') loadExtend(); else { await loadBook(true); loadStarts(); }
}

// ── оплата ──
let P = null, payFrom = 'book', payTick = null, payPoll = null;
function openPay(p, from){
  P = p; payFrom = from;
  $('sheet').classList.remove('hidden'); hideBar();
  $('payWhen').textContent = range(p.start, p.end);
  $('payAmount').textContent = p.price;
  const req = $('payReq'); req.innerHTML = '';
  const rows = [{label: 'Сума', value: p.amount + ' ' + p.currency, copyValue: p.amount, copy: true}].concat(p.requisites || []);
  rows.forEach(x => { const d = document.createElement('div'); d.className = 'req';
    d.innerHTML = '<div class="l"><span>' + esc(x.label) + '</span><b>' + esc(x.value) + '</b></div>';
    if(x.url){ const b = document.createElement('button'); b.textContent = 'Відкрити'; b.onclick = () => openUrl(x.value); d.appendChild(b); }
    else if(x.copy){ const b = document.createElement('button'); b.textContent = 'Копіювати'; b.onclick = () => copy(x.copyValue || x.value); d.appendChild(b); }
    req.appendChild(d); });
  if(p.payUrl){ const d = document.createElement('div'); d.className = 'btns'; d.innerHTML = '<button class="b ok">Відкрити сторінку оплати</button>'; d.firstChild.onclick = () => openUrl(p.payUrl); req.appendChild(d); }
  const review = p.status === 'pending_review';
  $('payForm').classList.toggle('hidden', review); $('payWait').classList.toggle('hidden', !review); $('payOk').classList.add('hidden');
  if(review){ $('payWaitText').textContent = 'Позначку «Я оплатив» отримали. Перевіряємо платіж, це займає до кількох хвилин. Можна закрити це вікно: час додасться сам.'; startPayPoll(); }
  clearInterval(payTick); payTick = setInterval(payTimer, 1000); payTimer();
}
function payTimer(){
  if(!P) return;
  const left = P.holdUntil - nowTs();
  $('payTimer').textContent = P.status === 'pending_review' ? '' : left > 0 ? 'Місце за тобою ще ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : 'Час на оплату вийшов. Якщо вже оплатив, натисни «Я оплатив».';
}
function closePay(){
  clearInterval(payTick); clearInterval(payPoll); P = null;
  $('sheet').classList.add('hidden');
  if(payFrom === 'extend') loadExtend(); else { tab = 'mine'; loadBook(true); }
}
async function payDone(){
  if(!P || busy) return; busy = true; $('payDone').disabled = true;
  const r = await api('POST', '/api/app/extend/paid', {bookingId: P.id, sender: $('paySender').value.trim()});
  busy = false; $('payDone').disabled = false;
  if(r.status !== 200 || !r.json.ok){ toast(errText(r)); return; }
  if(r.json.paid){ payOk(); return; }
  P.status = 'pending_review';
  $('payForm').classList.add('hidden'); $('payWait').classList.remove('hidden');
  $('payWaitText').textContent = r.json.auto ? 'Шукаємо твій платіж автоматично. Зазвичай це до двох хвилин. Можна закрити це вікно: час додасться сам, а ми напишемо в бот.'
    : 'Дякуємо! Адміністратор перевірить оплату й підтвердить бронь. Ми напишемо в бот. Це вікно можна закрити.';
  startPayPoll();
}
function payOk(){
  clearInterval(payPoll); haptic();
  $('payForm').classList.add('hidden'); $('payWait').classList.add('hidden'); $('payOk').classList.remove('hidden');
  $('payOkText').innerHTML = '<b>✅ Оплату підтверджено.</b><br>' + (payFrom === 'extend' ? 'Гру продовжено, можна грати далі.' : 'Бронь твоя. У свій час у програмі з\'явиться кнопка «Грати».');
}
function startPayPoll(){
  clearInterval(payPoll);
  payPoll = setInterval(async () => {
    if(!P) return;
    if(payFrom === 'extend'){ const r = await api('GET', '/api/app/extend'); if(r.json.ok && P && (!r.json.pending || r.json.pending.id !== P.id) && r.json.end >= P.end) payOk(); }
    else { const r = await api('GET', '/api/app/book'); if(!r.json.ok || !P) return; const m = r.json.mine.find(x => x.id === P.id || (x.pending && x.pending.id === P.id));
      if(m && (m.status === 'paid' || m.status === 'active')) payOk(); }
  }, 5000);
}
async function payCancel(){
  if(!P) return;
  if($('payCancel').dataset.sure !== '1'){ $('payCancel').dataset.sure = '1'; $('payCancel').textContent = 'Натисни ще раз, щоб скасувати'; setTimeout(() => { $('payCancel').dataset.sure = ''; $('payCancel').textContent = 'Скасувати цю бронь'; }, 4000); return; }
  $('payCancel').dataset.sure = ''; $('payCancel').textContent = 'Скасувати цю бронь';
  const id = P.id; clearInterval(payTick); clearInterval(payPoll); P = null; $('sheet').classList.add('hidden');
  await cancelBooking(id);
}

// ── продовження ──
let E = null, extHours = 0;
async function loadExtend(){
  $('title').textContent = 'Продовжити гру';
  const r = await api('GET', '/api/app/extend');
  if(r.status !== 200 || !r.json.ok){ $('loading').innerHTML = '<section><div class="note">' + esc(errText(r)) + '</div></section>'; return; }
  E = r.json; show('vExtend');
  if(!E.active){ $('extInfo').innerHTML = 'Продовжити можна під час гри: коли твоя бронь уже почалась. Щоб зіграти в інший час, зроби нову бронь.'; $('extPick').classList.add('hidden'); $('extPending').classList.add('hidden'); hideBar(); return; }
  if(!method || !E.methods.some(m => m.code === method)) method = E.method;
  renderExtend();
}
function renderExtend(){
  $('extInfo').innerHTML = 'Зараз твій час до <b>' + hm(E.end) + '</b>. Продовження додається одразу після нього, без перерви.' + (E.closed ? '<br>Зараз технічні роботи, продовження тимчасово закрите.' : '');
  const pend = E.pending;
  $('extPending').classList.toggle('hidden', !pend); $('extPick').classList.toggle('hidden', !!pend && pend.status === 'pending_review');
  if(pend){
    $('extPending').innerHTML = '<div class="card"><div class="top"><div><b class="t">Продовження до ' + hm(pend.end) + '</b><div class="when">' + esc(pend.price) + '</div></div><span class="st ' + (pend.status === 'hold' ? 'hold">Чекає оплати' : 'rev">Перевіряємо оплату') + '</span></div>'
      + '<div class="btns"><button class="b ok" id="extPay">' + (pend.status === 'hold' ? 'Оплатити' : 'Реквізити') + '</button>' + (pend.status === 'hold' ? '<button class="b bad" id="extCancel">Передумав</button>' : '') + '</div></div>';
    $('extPay').onclick = () => openPay(pend, 'extend');
    if($('extCancel')) $('extCancel').onclick = () => cancelBooking(pend.id);
  }
  const hEl = $('extHours'); hEl.innerHTML = '';
  E.options.forEach(o => { const c = document.createElement('div'); c.className = 'chip' + (o.hours === extHours ? ' on' : '') + (o.free ? '' : ' off');
    c.innerHTML = '+' + o.hours + ' год<small>' + (o.free ? esc(o.prices[method] || o.price) : 'зайнято') + '</small>';
    c.onclick = () => { if(!o.free){ toast('На стільки продовжити не вийде: далі час уже заброньований.'); return; } extHours = o.hours; haptic(); renderExtend(); }; hEl.appendChild(c); });
  $('extMethodsWrap').classList.toggle('hidden', E.methods.length < 2);
  const mEl = $('extMethods'); mEl.innerHTML = '';
  E.methods.forEach(m => { const c = document.createElement('div'); c.className = 'chip' + (m.code === method ? ' on' : ''); c.textContent = m.label;
    c.onclick = () => { method = m.code; haptic(); renderExtend(); }; mEl.appendChild(c); });
  const o = E.options.find(x => x.hours === extHours && x.free);
  if(E.closed || (pend && pend.status === 'pending_review')) hideBar();
  else if(!o) bar('Обери, на скільки продовжити', '', false, null);
  else bar('Продовжити на ' + o.hours + ' ' + hoursWord(o.hours) + ' за ' + (o.prices[method] || o.price), 'Гратимеш до ' + hm(E.end + o.hours * 3600) + '.', !busy, extend);
}
async function extend(){
  if(busy) return; busy = true; renderExtend();
  const r = await api('POST', '/api/app/extend', {hours: extHours, method});
  busy = false;
  if(r.status !== 200 || !r.json.ok){ toast(errText(r)); loadExtend(); return; }
  haptic(); extHours = 0; openPay(r.json.pending, 'extend');
}

// ── свій акаунт PSN ──
let psnTimer = null, psnBusy = false;
async function loadPsn(){
  $('title').textContent = 'Мій акаунт PSN';
  const r = await api('GET', '/api/app/session');
  if(r.status !== 200 || !r.json.ok){ $('loading').innerHTML = '<section><div class="note">' + esc(errText(r)) + '</div></section>'; return; }
  show('vPsn'); renderPsn(r.json);
  clearInterval(psnTimer); psnTimer = setInterval(async () => { if(psnBusy) return; const x = await api('GET', '/api/app/session'); if(x.json.ok) renderPsn(x.json); }, 5000);
}
window.__anyplayEvent = name => { if(name === 'psn'){ psnBusy = false; loadPsn(); } };
let psnKey = '';
function renderPsn(s){
  const st = s.myPsnStatus || '', key = [st, s.myPsn, s.myPsnCode, s.myPsnLink, s.myPsnLinked].join('|');
  if(key === psnKey) return; psnKey = key;
  const el = $('psn'); let h = '';
  const again = '<div class="btns"><button class="b" id="psnOther">Увійти в інший акаунт PSN</button></div>';
  if(!s.myPsn){
    h = '<div class="note"><b>Грай на своєму акаунті PlayStation</b><br>Свої збереження, свій персонаж у GTA Online, свої друзі й трофеї. Без цього ти граєш на спільному акаунті AnyPlay.</div>'
      + '<div class="card" style="margin-top:12px"><b class="t">Як це працює</b><ol><li>Входиш у свій PSN тут, на сайті Sony. Пароль бачить лише Sony.</li><li>Адміністратор додає твій профіль на приставку (кілька хвилин).</li><li>Ти підтверджуєш вхід на приставці за посиланням, яке з\'явиться тут.</li></ol>'
      + '<div class="btns"><button class="b ok" id="psnIn">У мене є акаунт PSN: увійти</button></div><div class="btns"><button class="b" id="psnNew">Створити акаунт PSN (безкоштовно)</button></div></div>';
  } else if(st === 'ready'){
    h = '<div class="note"><b>✅ Твій акаунт PSN ' + esc(s.myPsn) + ' підключено.</b><br>У час броні ти граєш на ньому: зі своїми збереженнями і друзями. Нічого налаштовувати більше не треба.</div>' + again;
  } else if(st === 'qr_sent' && (s.myPsnLink || s.myPsnCode)){
    h = '<div class="note"><b>Останній крок: увійди у свій PSN на приставці</b><br>Акаунт: ' + esc(s.myPsn) + '</div><div class="card" style="margin-top:12px"><ol>'
      + (s.myPsnLink ? '<li>Натисни кнопку нижче: відкриється сторінка Sony.</li><li>Увійди там у той самий акаунт PSN.</li>' : '<li>Адміністратор надіслав код для входу.</li>')
      + (s.myPsnCode ? '<li>Якщо Sony спитає код, він має збігатися з цим:</li>' : '') + '</ol>'
      + (s.myPsnCode ? '<div class="code">' + esc(s.myPsnCode) + '</div>' : '')
      + (s.myPsnLink ? '<div class="btns"><button class="b ok" id="psnLink">Відкрити сторінку входу Sony</button></div>' : '')
      + '<div class="btns"><button class="b" id="psnDone">✅ Вхід на приставці підтвердив</button></div></div>';
  } else if(st === 'signed_in'){
    h = '<div class="note"><b>Майже готово</b><br>Ти підтвердив вхід на приставці (акаунт ' + esc(s.myPsn) + '). Адміністратор завершує підключення, зазвичай це 1–2 хвилини. Ми напишемо в бот, а тут статус оновиться сам.</div><div class="spin"></div>';
  } else {
    h = '<div class="note"><b>' + (s.myPsnLinked ? 'Вхід у PSN виконано' : 'Заявку прийнято') + '</b><br>Акаунт: ' + esc(s.myPsn) + '. '
      + (s.myPsnLinked ? 'Адміністратор додає твій профіль на приставку, зазвичай це кілька хвилин. Щойно буде готово, тут з\'явиться останній крок, а ми напишемо в бот.'
        : 'Лишилось увійти у свій PSN, щоб програма могла підключатися під твоїм акаунтом.') + '</div>'
      + (s.myPsnLinked ? '<div class="spin"></div>' + again : '<div class="btns"><button class="b ok" id="psnIn">Увійти в PSN</button></div>');
  }
  el.innerHTML = h;
  const login = create => { if(native){ psnBusy = true; native.psnLogin(!!create); } else toast('Вхід у PSN працює лише в програмі'); };
  if($('psnIn')) $('psnIn').onclick = () => login(false);
  if($('psnNew')) $('psnNew').onclick = () => login(true);
  if($('psnOther')) $('psnOther').onclick = () => login(false);
  if($('psnLink')) $('psnLink').onclick = () => openUrl(s.myPsnLink);
  if($('psnDone')) $('psnDone').onclick = async () => { const r = await api('POST', '/api/app/psn/done', {});
    toast(r.json.ok ? 'Дякуємо! Адміністратор завершує підключення, ще 1–2 хвилини.' : errText(r)); psnKey = ''; loadPsn(); };
}

// ── як керувати самою приставкою ──
const HELP = [
  ['🏠', 'Головний екран приставки', 'Натисни й утримуй кнопку <b>PS</b> (кругла, внизу по центру) близько секунди. Відкриється головний екран PS5 зі списком ігор.'],
  ['⚡', 'Швидке меню', 'Коротко натисни <b>PS</b>. Знизу з\'явиться панель: звук, друзі, перемикання між грою і меню.'],
  ['⏹', 'Закрити гру', 'Відкрий головний екран, хрестовиною наведи на гру, натисни <b>OPTIONS</b> (овальна кнопка з трьома рисками, праворуч від PS) і обери «Закрити гру».'],
  ['🎮', 'Запустити іншу гру', 'На головному екрані обери гру хрестовиною ← → і натисни <b>✕</b>. Якщо попередня гра ще відкрита, приставка запропонує її закрити: погодься.'],
  ['🧭', 'Рух по меню', 'Хрестовина або лівий стік рухають вибір, <b>✕</b> підтверджує, <b>○</b> повертає назад. У самій грі <b>OPTIONS</b> відкриває паузу.'],
  ['👆', 'Кнопки на екрані', 'Тачпад: прямокутник між L і R, короткий дотик дорівнює натисканню. <b>L3</b> і <b>R3</b>: двічі швидко торкнись стіка й тримай. Овальна кнопка ліворуч від PS: Create (знімки екрана). Меню AnyPlay: кнопка з трьома крапками або «Назад» на телефоні.'],
  ['🕹', 'Свій геймпад', 'Можна підключити до телефона геймпад через Bluetooth чи кабель і сховати кнопки на екрані: меню AnyPlay, «Сховати кнопки на екрані».'],
  ['⚠️', 'Чого не робити', 'Не вимикай приставку, не вмикай режим спокою і не виходь з акаунта PSN: після цього підключитись не вийде. Щоб закінчити, обери «Вийти з гри» в меню AnyPlay.']
];
function loadHelp(){
  $('title').textContent = 'Як керувати приставкою';
  $('help').innerHTML = '<div class="note">Це працює в будь-якій грі й у меню PS5.</div>' + HELP.map(h =>
    '<div class="card" style="margin-top:10px"><b class="t">' + h[0] + ' ' + h[1] + '</b><div class="meta">' + h[2] + '</div></div>').join('');
  show('vHelp');
}

// ── запуск ──
$('back').onclick = closeApp;
$('sheetBack').onclick = closePay; $('payClose').onclick = closePay;
$('payDone').onclick = payDone; $('payCancel').onclick = payCancel;
$('tabNew').onclick = () => { tab = 'new'; renderBook(); };
$('tabMine').onclick = () => { tab = 'mine'; confirmId = 0; loadBook(true); };
window.__anyplayBack = () => { if(!$('sheet').classList.contains('hidden')){ closePay(); return true; } return false; };
if(MODE === 'extend') loadExtend(); else if(MODE === 'psn') loadPsn(); else if(MODE === 'help') loadHelp(); else { if(location.hash === '#mine') tab = 'mine'; loadBook(false); }
</script>
