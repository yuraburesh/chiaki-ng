name: AnyPlay iOS

# AnyPlay для iPhone та iPad. Крок 1: рідна частина (chiaki-lib, OpenSSL, curl, json-c, miniupnpc, Opus і C-інтерфейс
# ios/core) для arm64 iOS — одним AnyPlayCore.xcframework, який підключає проєкт Xcode. Далі тут же збирається
# сама програма без підпису (перевірка, що все компілюється); підписує й ставить на телефон власник у Xcode.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Машина GitHub (macos-26, macos-15, macos-15-intel), якщо на одній черга"
        type: string
        default: macos-15-intel
  push:
    branches: [anyplay]
    paths:
      - 'ios/**'
      - 'android/app/src/main/assets/anyplay/**'
      - 'lib/**'
      - 'cmake/OpenSSLExternalProject.cmake'
      - 'third-party/CMakeLists.txt'
      - '.github/workflows/anyplay-ios.yml'
      - 'gui/res/anyplay-controls*.json'
      - 'gui/include/anyplayvehicle.h'

permissions:
  contents: write   # 155: реліз з .ipa для SideStore (iPhone без кабелю й Xcode)

concurrency:
  group: anyplay-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # машини Apple (macos-15, macos-26) часто в черзі й не дістаються; Intel збирає для iPhone так само
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # рідна частина змінюється рідко: готовий xcframework з кешу (збірка програми тоді ~3 хв замість ~15)
      - name: Кеш рідної частини
        id: corecache
        uses: actions/cache/restore@v4
        with:
          path: out/AnyPlayCore.xcframework
          key: anyplay-ios-core-${{ hashFiles('lib/**', 'ios/core/**', 'cmake/**', 'third-party/CMakeLists.txt', 'CMakeLists.txt', '.gitmodules') }}-v1
      - name: Інструменти
        run: |
          brew install ninja protobuf@29 || true
          pip3 install --user 'protobuf>=5,<6' --break-system-packages
          echo "PROTOC_BIN=$(brew --prefix)/opt/protobuf@29/bin/protoc" >> "$GITHUB_ENV"
          "$(brew --prefix)/opt/protobuf@29/bin/protoc" --version
      - name: Налаштування (iOS arm64)
        if: steps.corecache.outputs.cache-hit != 'true'
        run: |
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DPROTOC="$PROTOC_BIN" \
            -DCHIAKI_ENABLE_IOS=ON -DCHIAKI_ENABLE_TESTS=OFF -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_GUI=OFF \
            -DCHIAKI_ENABLE_SETSU=OFF -DCHIAKI_ENABLE_FFMPEG_DECODER=OFF -DCHIAKI_ENABLE_PI_DECODER=OFF \
            -DCHIAKI_LIB_ENABLE_OPUS=OFF -DCHIAKI_ENABLE_SPEEX=OFF \
            -DCHIAKI_LIB_OPENSSL_EXTERNAL_PROJECT=ON -DCHIAKI_LIB_JSONC_EXTERNAL_PROJECT=ON -DCHIAKI_LIB_MINIUPNPC_EXTERNAL_PROJECT=ON \
            -DCHIAKI_ENABLE_STEAM_SHORTCUT=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF -DANYPLAY_LIVE=OFF \
            -DCURL_USE_LIBPSL=OFF -DCURL_USE_LIBSSH2=OFF -DUSE_LIBIDN2=OFF -DCURL_ZSTD=OFF -DCURL_BROTLI=OFF -DUSE_NGHTTP2=OFF \
            -DCURL_DISABLE_LDAP=ON -DENABLE_IPV6=ON
      - name: Збірка
        if: steps.corecache.outputs.cache-hit != 'true'
        run: cmake --build build-ios --target anyplay-core -j 4
      - name: Одна бібліотека й xcframework
        if: steps.corecache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p out/lib out/include
          find build-ios -name '*.a' -not -path '*/CMakeFiles/*' -not -path '*-prefix/src/*' | sort | tee out/libs.txt
          libtool -static -o out/lib/libAnyPlayCore.a $(cat out/libs.txt)
          cp ios/core/include/anyplay_core.h out/include/
          printf 'module AnyPlayCore {\n  header "anyplay_core.h"\n  export *\n}\n' > out/include/module.modulemap
          xcodebuild -create-xcframework -library out/lib/libAnyPlayCore.a -headers out/include -output out/AnyPlayCore.xcframework
          ls -la out/lib
          # перевірка: усі потрібні символи на місці
          nm -gU out/lib/libAnyPlayCore.a 2>/dev/null | grep -E ' _(anyplay_core_create|chiaki_session_init|opus_decode|curl_easy_init|EVP_EncryptInit)$' || true
      - name: Зберегти рідну частину в кеш
        if: steps.corecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/AnyPlayCore.xcframework
          key: ${{ steps.corecache.outputs.cache-primary-key }}
      # ── сама програма: ресурси ті самі, що на Android; проєкт Xcode робить XcodeGen ──
      - name: Проєкт Xcode
        run: |
          set -e
          BUILD="$(tr -d '[:space:]' < anyplay-build.txt)"
          mkdir -p ios/App/Frameworks ios/App/Resources
          rm -rf ios/App/Frameworks/AnyPlayCore.xcframework ios/App/Resources/web
          cp -R out/AnyPlayCore.xcframework ios/App/Frameworks/
          # у програмі тека зветься web: macOS не розрізняє великі й малі літери, і тека «anyplay» в AnyPlay.app
          # збігалася з самою програмою «AnyPlay» (ld: open() failed, errno=21)
          cp -R android/app/src/main/assets/anyplay ios/App/Resources/web
          cp android/app/src/main/assets/cacert.pem ios/App/Resources/cacert.pem
          # 145: клавіатура й миша — ті самі розкладки, що на комп'ютері (GTA VI, GTA V, універсальна),
          # і той самий визначник «пішки чи транспорт» за адаптивними курками
          mkdir -p ios/App/Resources/web/keys
          cp gui/res/anyplay-controls*.json ios/App/Resources/web/keys/
          cp gui/include/anyplayvehicle.h ios/App/AnyPlay/anyplayvehicle.h
          sed -i '' "s/ANYPLAY_BUILD: \"1\"/ANYPLAY_BUILD: \"$BUILD\"/" ios/App/project.yml
          # 155: версія з номером збірки — SideStore за нею бачить, що вийшла нова
          sed -i '' "s/MARKETING_VERSION: \"1.0\"/MARKETING_VERSION: \"1.0.$BUILD\"/; s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD\"/" ios/App/project.yml
          brew install xcodegen
          cd ios/App && xcodegen generate
      - name: Збірка програми (без підпису, перевірка)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project AnyPlay.xcodeproj -scheme AnyPlay -configuration Debug -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log"; then
            echo "──── подробиці помилок ────"
            grep -E -i "undefined|symbol|ld: |linker" "$RUNNER_TEMP/xcodebuild.log" | grep -v "^    /" | head -120
            echo "──── перед помилкою ────"
            grep -B40 "linker command failed" "$RUNNER_TEMP/xcodebuild.log" | cut -c1-400 | head -80
            exit 1
          fi
      # 155: готова програма (.ipa без підпису) для SideStore на самому iPhone: SideStore підписує її Apple ID власника
      # і сам продовжує 7 днів; нові збірки бачить у джерелі anyplay-sidestore.json (реліз anyplay-ios-source)
      - name: IPA для SideStore
        id: ipa
        working-directory: ios/App
        run: |
          set -eo pipefail
          BUILD="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/anyplay-build.txt")"
          xcodebuild -project AnyPlay.xcodeproj -scheme AnyPlay -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > "$RUNNER_TEMP/release.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/release.log" | head -40; exit 1; }
          APP="$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/dist"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/AnyPlay-iPhone-$BUILD.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/dist"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Реліз для SideStore
        if: ${{ github.ref == 'refs/heads/anyplay' && steps.ipa.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.ipa.outputs.build }}
        run: |
          set -e
          REPO="$GITHUB_REPOSITORY"
          IPA="dist/AnyPlay-iPhone-$BUILD.ipa"
          TAG="anyplay-ios-r$GITHUB_RUN_NUMBER"
          NOTES="$(cat anyplay-notes.txt 2>/dev/null || true)"
          gh release create "$TAG" "$IPA" -R "$REPO" --target "$GITHUB_SHA" --latest=false --prerelease \
            --title "AnyPlay для iPhone (збірка $BUILD)" \
            --notes "Що нового: $NOTES
          AnyPlay для iPhone та iPad, збірка $BUILD. Ставиться через SideStore (джерело AnyPlay) або через Xcode."
          SIZE=$(stat -f%z "$IPA")
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE="https://github.com/$REPO/releases/download"
          python3 - "$BUILD" "$SIZE" "$DATE" "$BASE/$TAG/AnyPlay-iPhone-$BUILD.ipa" "$BASE/anyplay-ios-source" "$NOTES" > dist/anyplay-sidestore.json <<'PY'
          import json, sys
          build, size, date, url, src, notes = sys.argv[1:7]
          print(json.dumps({
              "name": "AnyPlay", "identifier": "com.any.play.source", "subtitle": "Оренда PS5: грай з iPhone та iPad",
              "sourceURL": src + "/anyplay-sidestore.json", "iconURL": src + "/anyplay-icon.png", "tintColor": "#5b3f7a",
              "apps": [{
                  "name": "AnyPlay", "bundleIdentifier": "com.any.play", "developerName": "AnyPlay",
                  "subtitle": "Грай у PS5 з iPhone та iPad", "localizedDescription": "AnyPlay: гра на орендованій PS5 через інтернет.",
                  "iconURL": src + "/anyplay-icon.png", "tintColor": "#5b3f7a", "category": "games",
                  "versions": [{"version": "1.0." + build, "buildVersion": build, "date": date, "localizedDescription": notes,
                                "downloadURL": url, "size": int(size), "minOSVersion": "15.0"}],
                  "appPermissions": {"entitlements": [], "privacy": {}}}],
              "news": []}, ensure_ascii=False, indent=2))
          PY
          cp ios/App/AnyPlay/Assets.xcassets/AppIcon.appiconset/icon-1024.png dist/anyplay-icon.png
          gh release view anyplay-ios-source -R "$REPO" >/dev/null 2>&1 || gh release create anyplay-ios-source -R "$REPO" \
            --target "$GITHUB_SHA" --latest=false --prerelease --title "AnyPlay для iPhone: джерело SideStore" \
            --notes "Джерело для SideStore. Додай у SideStore адресу: $BASE/anyplay-ios-source/anyplay-sidestore.json"
          gh release upload anyplay-ios-source dist/anyplay-sidestore.json dist/anyplay-icon.png -R "$REPO" --clobber
          cat dist/anyplay-sidestore.json
      - name: Пакет для Mac
        if: always()
        run: |
          cd ios/App
          rm -rf build DerivedData
          zip -qry "$GITHUB_WORKSPACE/AnyPlay-iOS.zip" AnyPlay.xcodeproj AnyPlay Frameworks Resources project.yml
          ls -la "$GITHUB_WORKSPACE/AnyPlay-iOS.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnyPlay-iOS
          path: AnyPlay-iOS.zip
